<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON DRIFT // Midnight Dockyard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      :root { --pink:#ff2bd6; --cyan:#22f3ff; --purple:#8a2bff; --amber:#ffb627; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05010d; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; color: #fff; user-select: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }
      #boot-error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #12000c; color: #ff5c8a; font-family: monospace; padding: 40px; white-space: pre-wrap; z-index: 999; }
      @keyframes blink {
        from { opacity: 0.35; transform: translate(-50%, -50%) scale(0.96); }
        to { opacity: 1.0; transform: translate(-50%, -50%) scale(1.04); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-root"></div>
    <div id="boot-error"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
